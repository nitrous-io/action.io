<form class="form-horizontal">
  <fieldset>
    <div class="control-group" data-spec="name-control-group">
      <label class="control-label" for="box_name">Name</label>
      <div class="controls">
        <input id="box_name" name="name" type="text">
      </div>
    </div>
    <div class="control-group" data-spec="region-control-group">
      <label class="control-label" for="box_region">Region</label>
      <div class="controls">
        <select id="box_region" name="region">
          <option value="us-east-1">
            us-east-1
          </option>
          <option value="us-west-1">
            us-west-1
          </option>
          <option value="us-west-2">
            us-west-2
          </option>
          <option value="eu-west-1">
            eu-west-1
          </option>
          <option value="ap-southeast-1">
            ap-southeast-1
          </option>
          <option value="ap-northeast-1">
            ap-northeast-1
          </option>
          <option value="sa-east-1">
            sa-east-1
          </option>
        </select>
      </div>
    </div>
    <div class="control-group" data-spec="box_template_id-control-group">
      <label class="control-label" for="box_box_template_id">Template</label>
      <div class="controls">
        <select id="box_box_template_id" name="box_template_id">
          <option value="2">
            ubuntu + rails
          </option>
          <option value="3">
            ubuntu + nodejs
          </option>
        </select>
        <span class="help-inline">Some existing help.</span>
      </div>
    </div>
    <div class="control-group">
      <div class="controls">
        <button class="btn btn-primary" id="create_box_button" value="">Create Box</button>
      </div>
    </div>
  </fieldset>
</form>
