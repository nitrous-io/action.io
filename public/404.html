      padding: 0 4em;

    ul.fubar-links li a { color: #def; text-decoration: none; padding: 5px 7px; display: block; background-color: #242a2f; }
    ul.fubar-links li a:hover { background: #3f4a4f; }
    ul.fubar-links li a:visited { color: #def; }

</head>

<body>
  <div class="dialog">
    <a href="/"><img src="/images/lightning-solo85.png" /></a>
